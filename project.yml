name: Komodo
options:
  bundleIdPrefix: app.komodo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  KomodoCore:
    path: KomodoCore

targets:
  Komodo:
    type: application
    platform: macOS
    sources:
      - Komodo
    dependencies:
      - package: KomodoCore
      # The MCP helper ships inside the app, where Settings' setup snippet points (ARCHITECTURE §10).
      - target: komodo-mcp
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_NAME: Komodo
        PRODUCT_BUNDLE_IDENTIFIER: app.komodo.Komodo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Komodo
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_PREVIEWS: YES

  komodo-mcp:
    type: tool
    platform: macOS
    sources:
      - KomodoMCP
    dependencies:
      - package: KomodoCore
    settings:
      base:
        PRODUCT_NAME: komodo-mcp
        PRODUCT_BUNDLE_IDENTIFIER: app.komodo.mcp
        GENERATE_INFOPLIST_FILE: YES
        # A command-line tool has no bundle, so its version lives in the binary.
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        SKIP_INSTALL: YES

schemes:
  Komodo:
    build:
      targets:
        Komodo: all
    run:
      config: Debug
    archive:
      config: Release
